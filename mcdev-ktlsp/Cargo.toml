[package]
name = "mcdev-ktlsp"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ktcore.workspace = true
ktlsp.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
tower-lsp-server = "0.23"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
